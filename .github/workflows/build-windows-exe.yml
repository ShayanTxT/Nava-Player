name: Build Windows EXE

# Builds Nava.exe on a real Windows runner, so you don't need a Windows PC
# (and the artifact is built with a genuine MSVC toolchain + Python).
#
#   Actions -> Build Windows EXE -> Run workflow      -> download the artifact
#   push a tag like v1.0.0                            -> Nava.exe is attached to the release
#
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Generate the application icon
        run: python tools/make_ico.py

      - name: Build Nava.exe
        run: python -m PyInstaller --noconfirm --clean --log-level WARN Nava.spec

      - name: Quick sanity check
        continue-on-error: true          # CI machines have no audio device - that's fine
        run: dist\Nava.exe --diagnose

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nava.exe
          path: dist/Nava.exe
          if-no-files-found: error

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Nava.exe
          generate_release_notes: true
